# Production compose. Usage:
#   NEXT_PUBLIC_API_BASE_URL=https://yourdomain/ docker compose -f "compose prod.yaml" up -d --build
#
# Differences from the dev compose.yaml:
#   * services build from Dockerfile.prod (multi-stage: compiled dist/,
#     pruned prod-only dependencies, non-root user, no bind mounts)
#   * no dev utilities (phpmyadmin, dozzle) and no RabbitMQ management port
#   * separate compose project (-prod suffix) so dev and prod can coexist
#   * infra credentials are parameterized: put MYSQL_ROOT_PASSWORD,
#     REDIS_PASSWORD, RABBITMQ_USER/PASS in a root .env or the shell
#     (defaults match the dev stack so it boots as-is)
#   * services read their secrets from the gitignored .env.docker files —
#     create them (see services/*/.env.example) before the first `up`
#   * NODE_ENV=production is forced per service (overrides env_file)

name: node-microservice-ecommerce-prod

services:
  # --- INFRASTRUCTURE ---

  redis:
    image: redis:7-alpine
    restart: always
    command:
      [
        "redis-server",
        "--loglevel",
        "warning",
        "--requirepass",
        "${REDIS_PASSWORD:-redis_dev_pass}",
      ]
    volumes:
      - redis_data:/data
    networks:
      - app_network

  mysql:
    image: mysql:8.0.36
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root_dev_pass}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:4.0-alpine
    hostname: rabbitmq-host
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-app_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # --- MICROSERVICES (compiled, pruned, non-root) ---

  auth-service:
    build:
      context: ./services/auth
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./services/auth/.env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  customer-service:
    build:
      context: ./services/customer
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./services/customer/.env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  factor-service:
    build:
      context: ./services/factor
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./services/factor/.env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  vehicle-service:
    build:
      context: ./services/vehicle
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./services/vehicle/.env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  notification-service:
    build:
      context: ./services/notification
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./services/notification/.env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  product-service:
    build:
      context: ./services/product
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./services/product/.env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  # --- GATEWAY ---

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./services/gateway/.env.docker
    environment:
      - NODE_ENV=production
    depends_on:
      - auth-service
      - customer-service
      - factor-service
      - vehicle-service
      - notification-service
      - product-service
    networks:
      - app_network

  # --- CLIENT (Next.js, built with the public API origin baked in) ---

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        # Inlined into the bundle AT BUILD TIME — changing it requires a
        # rebuild of the client image!
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/}
    restart: always
    environment:
      - NODE_ENV=production
    depends_on:
      - gateway
    networks:
      - app_network

  # --- NGINX (the ONLY public entry point) ---

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      # Enable after adding TLS certs + a 443 server block:
      # - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - gateway
      - client
    networks:
      - app_network

volumes:
  mysql_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
