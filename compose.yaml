name: node-microservice-ecommerce

services:
  # --- INFRASTRUCTURE ---

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command:
      [
        "redis-server",
        "--loglevel",
        "warning",
        "--requirepass",
        "redis_dev_pass",
      ]
    volumes:
      - redis_data:/data
    networks:
      - app_network

  mysql:
    image: mysql:8.0.36
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_dev_pass",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq-host
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: app_user
      RABBITMQ_DEFAULT_PASS: app_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # --- MICROSERVICES (Internal Only - No Ports Exposed) ---

  auth-service:
    build: ./services/auth
    restart: always
    env_file:
      - ./services/auth/.env.docker
    volumes:
      - ./services/auth/src:/app/src
      - ./services/auth/node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  customer-service:
    build: ./services/customer
    restart: always
    env_file:
      - ./services/customer/.env.docker
    volumes:
      - ./services/customer/src:/app/src
      - ./services/customer/node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  factor-service:
    build: ./services/factor
    restart: always
    env_file:
      - ./services/factor/.env.docker
    volumes:
      - ./services/factor/src:/app/src
      - ./services/factor/node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  vehicle-service:
    build: ./services/vehicle
    restart: always
    env_file:
      - ./services/vehicle/.env.docker
    volumes:
      - ./services/vehicle/src:/app/src
      - ./services/vehicle/node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  notification-service:
    build: ./services/notification
    restart: always
    env_file:
      - ./services/notification/.env.docker
    volumes:
      - ./services/notification/src:/app/src
      - ./services/notification/node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  product-service:
    build: ./services/product
    restart: always
    env_file:
      - ./services/product/.env.docker
    volumes:
      - ./services/product/src:/app/src
      - ./services/product/node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  # --- GATEWAY (The ONLY Public Entry Point) ---

  gateway:
    build: ./services/gateway
    restart: always
    env_file:
      - ./services/gateway/.env.docker
    volumes:
      - ./services/gateway/src:/app/src
      - ./services/gateway/node_modules:/app/node_modules
    expose:
      - "3000"
    depends_on:
      - auth-service
      - customer-service
      - factor-service
      - vehicle-service
      - notification-service
      - product-service
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
    networks:
      - app_network

  # --- UTILS ---

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_dev_pass
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

        # --- MONITORING ---

  dozzle:
    image: amir20/dozzle:v10
    container_name: dozzle
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8083:8080"
    environment:
      # Optional: Enable real-time log streaming for better performance
      DOZZLE_ENABLE_ACTIONS: "true"
      # Optional: Filter to only show containers on this project's network
      DOZZLE_FILTER: "label=com.docker.compose.project=node-microservice-ecommerce"
    networks:
      - app_network

volumes:
  mysql_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge
