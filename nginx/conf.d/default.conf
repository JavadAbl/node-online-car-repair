upstream gateway_backend {
    # Nginx resolves "gateway" using Docker's internal DNS.
    # If you scale the gateway service, Docker returns multiple IPs.
    server gateway:3000;

    # Optional: Add health checks (requires Nginx Plus or OpenResty,
    # but standard Nginx will silently retry next server on connection refused)
}

upstream client_backend {
    # Next.js dev server (HMR websocket included).
    server client:3000;
}

server {
    listen 80;

    # Match any host: works for http://localhost in dev and the real
    # domain in production (this is the default/only server block).
    server_name _;

    # ------------------------------------------------------------------
    # Microservice API -> Gateway
    # Case-insensitive so both "Auth-Api/..." (as used by the client)
    # and "auth-api/..." are forwarded; the gateway router itself is
    # case-insensitive as well.
    # ------------------------------------------------------------------
    location ~* ^/(notification|vehicle|auth|product|customer|factor)-api/ {
        proxy_pass http://gateway_backend;

        # Standard reverse proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for HTTP/2 and Websockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ------------------------------------------------------------------
    # Swagger JSON specs -> Gateway
    # (The Swagger UI root on the gateway is shadowed by the client;
    #  the raw specs stay reachable here.)
    # ------------------------------------------------------------------
    location /api-docs/ {
        proxy_pass http://gateway_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Everything else -> Next.js client
    # (pages, /_next/* assets and the dev-server HMR websocket)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://client_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev server: hot-reload websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
